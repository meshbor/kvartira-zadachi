name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/apartment-design-kitchen-hallway-4579
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect static site
        run: |
          mkdir site
          cp index.html DESIGN.md README.md .nojekyll site/
          cp -r design site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
