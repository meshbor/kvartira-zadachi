<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Georgia, 'Times New Roman', serif">
  <rect width="980" height="640" fill="#f7f3ec"/>
  <text x="40" y="36" font-size="20" fill="#2c241c">Квартира ~92 м² — схема по вашему плану</text>
  <text x="40" y="58" font-size="12" fill="#6b5e52">Синие размеры — с фото. Серые — оценка по рисунку, уточнить рулеткой.</text>
  <text x="490" y="78" font-size="11" fill="#7a6a5a" text-anchor="middle">окна / фасад</text>
  <g>
    <rect x="70" y="90" width="162" height="198" fill="#efe4d4" stroke="#2c241c" stroke-width="2.5"/>
    <rect x="70" y="90" width="28" height="198" fill="#e2d2bc" stroke="#2c241c" stroke-width="1"/>
    <text x="168" y="178" font-size="28" fill="#1e5aa8" text-anchor="middle" font-weight="700">1</text>
    <text x="168" y="200" font-size="13" fill="#2c241c" text-anchor="middle">кухня</text>
    <text x="168" y="218" font-size="10" fill="#1e5aa8" text-anchor="middle">4,5 × 2,7 м чистых</text>
    <text x="168" y="232" font-size="10" fill="#6b5e52" text-anchor="middle">+ стенка ~0,6 м слева</text>
    <rect x="78" y="94" width="12" height="8" fill="#9bb7d4"/>
    <text x="151" y="104" font-size="9" fill="#5a7a98">окно</text>
  </g>
  <g>
    <rect x="232" y="90" width="300" height="154" fill="#eadcc8" stroke="#2c241c" stroke-width="2.5"/>
    <text x="382" y="158" font-size="28" fill="#1e5aa8" text-anchor="middle" font-weight="700">2</text>
    <text x="382" y="180" font-size="13" fill="#2c241c" text-anchor="middle">гостиная</text>
    <text x="382" y="198" font-size="10" fill="#1e5aa8" text-anchor="middle">~7,0 × 3,5 м</text>
    <text x="382" y="214" font-size="10" fill="#6b5e52" text-anchor="middle">дальняя часть = зона стола</text>
    <rect x="340" y="94" width="80" height="8" fill="#9bb7d4"/>
  </g>
  <g>
    <rect x="532" y="90" width="150" height="130" fill="#e7efe8" stroke="#2c241c" stroke-width="2.5"/>
    <text x="607" y="148" font-size="28" fill="#1e5aa8" text-anchor="middle" font-weight="700">3</text>
    <text x="607" y="170" font-size="13" fill="#2c241c" text-anchor="middle">детская</text>
    <text x="607" y="186" font-size="10" fill="#6b5e52" text-anchor="middle">готово</text>
    <rect x="572" y="94" width="70" height="8" fill="#9bb7d4"/>
  </g>
  <g>
    <rect x="532" y="220" width="150" height="78" fill="#d9e4ea" stroke="#2c241c" stroke-width="2.5"/>
    <text x="607" y="254" font-size="28" fill="#1e5aa8" text-anchor="middle" font-weight="700">6</text>
    <text x="607" y="274" font-size="12" fill="#2c241c" text-anchor="middle">ванная + туалет</text>
    <text x="607" y="288" font-size="10" fill="#6b5e52" text-anchor="middle">не делали</text>
  </g>
  <g>
    <rect x="532" y="298" width="150" height="168" fill="#e7efe8" stroke="#2c241c" stroke-width="2.5"/>
    <text x="607" y="370" font-size="28" fill="#1e5aa8" text-anchor="middle" font-weight="700">4</text>
    <text x="607" y="392" font-size="13" fill="#2c241c" text-anchor="middle">спальня</text>
    <text x="607" y="408" font-size="10" fill="#6b5e52" text-anchor="middle">готово</text>
  </g>
  <g>
    <rect x="532" y="466" width="150" height="52" fill="#e8f0f4" stroke="#2c241c" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="607" y="488" font-size="22" fill="#1e5aa8" text-anchor="middle" font-weight="700">5</text>
    <text x="607" y="506" font-size="11" fill="#2c241c" text-anchor="middle">балкон рабочий ~2–3 м²</text>
  </g>
  <g>
    <rect x="70" y="288" width="70" height="86" fill="#d9e4ea" stroke="#2c241c" stroke-width="2.5"/>
    <text x="105" y="322" font-size="24" fill="#1e5aa8" text-anchor="middle" font-weight="700">7</text>
    <text x="105" y="340" font-size="11" fill="#2c241c" text-anchor="middle">туалет</text>
    <text x="105" y="354" font-size="9" fill="#6b5e52" text-anchor="middle">швабры</text>
    <text x="105" y="366" font-size="9" fill="#6b5e52" text-anchor="middle">не делали</text>
  </g>
  <g>
    <rect x="140" y="288" width="392" height="86" fill="#efece6" stroke="#2c241c" stroke-width="2.5"/>
    <rect x="140" y="288" width="104" height="86" fill="#e4ddd3" stroke="#2c241c" stroke-width="1.5"/>
    <text x="192" y="322" font-size="12" fill="#2c241c" text-anchor="middle">прихожая</text>
    <text x="192" y="340" font-size="10" fill="#1e5aa8" text-anchor="middle">2,6 × 1,4 м</text>
    <text x="192" y="356" font-size="9" fill="#6b5e52" text-anchor="middle">рейки + крючки</text>
    <text x="390" y="328" font-size="12" fill="#2c241c" text-anchor="middle">коридор к жилым</text>
    <text x="390" y="346" font-size="10" fill="#6b5e52" text-anchor="middle">дневная зона ← → спальная</text>
    <rect x="178" y="286" width="22" height="4" fill="#f7f3ec"/>
    <rect x="300" y="286" width="36" height="4" fill="#f7f3ec"/>
    <rect x="528" y="248" width="4" height="22" fill="#f7f3ec"/>
    <rect x="528" y="330" width="4" height="22" fill="#f7f3ec"/>
    <rect x="138" y="318" width="4" height="22" fill="#f7f3ec"/>
  </g>
  <polygon points="28,331 68,318 68,344" fill="#1e5aa8"/>
  <text x="48" y="368" font-size="11" fill="#1e5aa8" text-anchor="middle">вход</text>
  <rect x="70" y="540" width="16" height="16" fill="#eadcc8" stroke="#2c241c"/>
  <text x="94" y="553" font-size="12" fill="#2c241c">дневная зона — делаем сейчас (1, 2, прихожая)</text>
  <rect x="70" y="564" width="16" height="16" fill="#e7efe8" stroke="#2c241c"/>
  <text x="94" y="577" font-size="12" fill="#2c241c">спальная зона — уже сделана (3, 4, 5)</text>
  <rect x="70" y="588" width="16" height="16" fill="#d9e4ea" stroke="#2c241c"/>
  <text x="94" y="601" font-size="12" fill="#2c241c">мокрые — следующий этап (6, 7)</text>
  <text x="700" y="560" font-size="11" fill="#6b5e52">Пропорции комнат 3, 4, 6, 7</text>
  <text x="700" y="576" font-size="11" fill="#6b5e52">условные: нет точных метров.</text>
</svg>
